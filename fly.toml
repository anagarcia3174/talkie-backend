# Fly.io config for the Talkie API. Secrets (DATABASE_URL, TMDB_API_KEY,
# SUPABASE_*, APPLE_*) are set with `fly secrets`, never in this file.
app = "talkie-api"
primary_region = "iad" # Ashburn, VA — close to Supabase (us-east-2)

[env]
  PORT = "8080"
  LOG_LEVEL = "info"
  ALLOWED_ORIGIN = "https://gettalkie.app"
  # Fly's proxy sets this to the real client IP (used for rate limiting).
  CLIENT_IP_HEADER = "Fly-Client-IP"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: no cold starts for users or App Review.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
